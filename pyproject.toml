[project]
name = "local-research-agent"
version = "1.0.0rc1"
description = "A local research agent: an Ollama LLM with native tool calling, arXiv tools, an MCP server and an evaluation harness."
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "llm",
    "agent",
    "tool-calling",
    "ollama",
    "mcp",
    "model-context-protocol",
    "arxiv",
    "evaluation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Lower bounds = the versions the test suite was run against (see uv.lock).
dependencies = [
    "anyio>=4.16",
    "defusedxml>=0.7.1",
    "httpx>=0.28.1",
    "mcp>=2.3.0,<3",
    "pydantic>=2.14.2",
]

[project.scripts]
local-research-agent = "local_research_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_research_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root, so tests can import the `evals` harness package (not shipped in the wheel).
pythonpath = ["."]
markers = [
    "integration: hits a real service (Ollama with the configured model, or the arXiv API)",
    "mcp: starts real MCP server subprocesses (local only: fake arXiv, no network)",
]
# Integration tests are opt-in: `uv run pytest -m integration` (a later -m overrides this one).
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py311"
src = [".", "src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
