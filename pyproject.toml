[project]
name = "local-research-agent"
version = "0.1.0"
description = "Local LLM agent (Ollama) with native tool calling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "defusedxml>=0.7",
    "httpx>=0.27",
    "mcp>=2.3,<3",
    "pydantic>=2.7",
]

[project.scripts]
local-research-agent = "local_research_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_research_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root, so tests can import the `evals` harness package (not shipped in the wheel).
pythonpath = ["."]
markers = [
    "integration: hits a real service (Ollama with the configured model, or the arXiv API)",
    "mcp: starts real MCP server subprocesses (local only: fake arXiv, no network)",
]
# Integration tests are opt-in: `uv run pytest -m integration` (a later -m overrides this one).
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py311"
src = [".", "src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
